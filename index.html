<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 فری فائر اقوال</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  margin:0;
  font-family:'Noto Nastaliq Urdu', serif;
  background:#0f172a;
  color:#fff;
}

.title{
  text-align:center;
  font-size:28px;
  padding:15px;
  background:linear-gradient(90deg,red,orange,yellow,green,cyan,blue,violet);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

#search{
  width:80%;
  margin:10px auto;
  padding:12px;
  border-radius:10px;
  border:none;
  display:block;
  text-align:center;
}

.card{
  margin:15px;
  padding:15px;
  border-radius:15px;
  background:rgba(255,255,255,0.06);
  position:relative;
}

.text{
  margin-top:40px;
  font-size:14px;
  line-height:2;
}

.actionBox{
  position:absolute;
  top:10px;
  left:10px;
  display:flex;
  gap:10px;
}

.actionBox button{
  background:none;
  border:none;
  font-size:18px;
  color:#fff;
  cursor:pointer;
}

#loadMore{
  margin:20px auto;
  display:block;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  font-weight:800;
}
</style>
</head>

<body>

<div class="title">فری فائر اقوال</div>

<input id="search" placeholder="اقوال تلاش کریں..." oninput="searchQuotes()">

<div id="container"></div>

<button id="loadMore" onclick="loadMore()">مزید لوڈ کریں</button>

<script>

/* 🔥 SETTINGS */
const MIN_LENGTH = 10;
const MAX_LENGTH = 80;

/* CUSTOM QUOTES */
const customQuotes = [
{id:1, show:"نشانہ میرا پرفیکٹ انجام دشمن کا فکس", copy:"text1"},
{id:2, show:"میری انٹری ہی کافی ہے گیم پلٹ جاتی ہے", copy:"text2"},
{id:3, show:"خاموشی میری طاقت ہے", copy:"text3"},
];

/* AUTO QUOTES (200 + LENGTH FILTER) */
const autoQuotes = Array.from({length:200},(_,i)=>({
id:i+100,
show:"یہ قول نمبر "+(i+1),
copy:"text "+(i+1)
})).filter(q =>
    q.show.length >= MIN_LENGTH &&
    q.show.length <= MAX_LENGTH
);

/* MERGE */
const quotes = [...customQuotes, ...autoQuotes];

let filtered = [...quotes];
let page = 1;
let limit = 20;

/* SEARCH + FILTER */
function searchQuotes(){
let v = document.getElementById("search").value.toLowerCase();

filtered = quotes.filter(q =>
    q.show.toLowerCase().includes(v) &&
    q.show.length >= MIN_LENGTH &&
    q.show.length <= MAX_LENGTH
);

page = 1;
render();
}

/* LOAD MORE */
function loadMore(){
page++;
render();
}

/* COPY */
function copyText(text){
navigator.clipboard.writeText(text);
}

/* 🔊 SPEAK (ANDROID WEBVIEW ONLY) */
function speakText(text){
    if(window.Android && Android.speak){
        Android.speak(text);
    } else {
        alert("Speak not supported in browser");
    }
}

/* RENDER */
function render(){
let c = document.getElementById("container");
c.innerHTML = "";

filtered.slice(0, page * limit).forEach(q=>{

c.innerHTML += `
<div class="card">

<div class="actionBox">

<button onclick="copyText('${q.copy}')">
<i class="fas fa-copy"></i>
</button>

<button onclick="speakText('${q.show}')">
<i class="fas fa-volume-up"></i>
</button>

</div>

<div class="text">${q.show}</div>

</div>`;
});
}

render();

</script>

</body>
</html>
