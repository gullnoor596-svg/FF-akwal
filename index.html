<style>
:root{
  --bg:#0f172a;
  --card:rgba(255,255,255,0.06);
  --text:#fff;
  --green:#22c55e;
}

body.light{
  --bg:#f1f5f9;
  --card:#fff;
  --text:#111827;
  --green:#16a34a;
}

body{
  margin:0;
  font-family:'Noto Nastaliq Urdu', serif;
  background:var(--bg);
  color:var(--text);
}

.title{
  text-align:center;
  font-size:28px;
  font-weight:900;
  padding:15px;
  background:linear-gradient(90deg,red,orange,yellow,green,cyan,blue,violet,red);
  background-size:300%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:move 4s linear infinite;
}

@keyframes move{
  0%{background-position:0%;}
  100%{background-position:300%;}
}

#search{
  width:80%;
  margin:10px auto;
  padding:12px;
  border-radius:10px;
  border:none;
  display:block;
  text-align:center;
  font-weight:800;
}

.card{
  margin:15px;
  padding:15px;
  border-radius:15px;
  background:var(--card);
  border:1px solid rgba(34,197,94,0.3);
  position:relative;
}

.text{
  margin-top:40px;
  font-size:14px;
  line-height:2;
}

.actionBox{
  position:absolute;
  top:10px;
  left:10px;
  display:flex;
  gap:12px;
}

.actionBox button{
  background:none;
  border:none;
  font-size:18px;
  cursor:pointer;
  color:var(--text);
}

#loadMore{
  margin:20px auto;
  display:block;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  background:var(--green);
  color:#000;
  font-weight:800;
}
</style>

const autoQuotes = Array.from({length:200},(_,i)=>({
id:i+100,
show:"یہ قول نمبر "+(i+1),
copy:"text "+(i+1)
}));

const quotes = [...customQuotes,...autoQuotes];

let filtered = [...quotes];
let page = 1;
let limit = 20;

/* SEARCH */
function searchQuotes(){
let v = document.getElementById("search").value.toLowerCase();
filtered = quotes.filter(q => q.show.toLowerCase().includes(v));
page = 1;
render();
}

/* LOAD MORE */
function loadMore(){
page++;
render();
}

/* COPY */
function copyText(text){
navigator.clipboard.writeText(text);
}

/* SPEAK */
function speakText(text){
let msg = new SpeechSynthesisUtterance(text);
msg.lang = "ur-PK";
speechSynthesis.speak(msg);
}

/* RENDER */
function render(){
let c = document.getElementById("container");
c.innerHTML = "";

filtered.slice(0,page*limit).forEach(q=>{

c.innerHTML += `
<div class="card">

<div class="actionBox">

<button onclick="copyText('${q.copy}')">
<i class="fas fa-copy"></i>
</button>

<button onclick="speakText('${q.show}')">
<i class="fas fa-volume-up"></i>
</button>

</div>

<div class="text">${q.show}</div>

</div>`;
});
}

render();

</script>
