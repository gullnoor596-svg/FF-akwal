<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 فری فائر اقوال</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* ===== BODY (FAST) ===== */
body{
  margin:0;
  font-family:'Noto Nastaliq Urdu', serif;
  background: #0f172a;
  color:#fff;
}

/* ===== TITLE ===== */
.title{
  text-align:center;
  font-size:28px;
  margin:15px;
  font-weight:900;
  background:linear-gradient(90deg,#22c55e,#06b6d4,#f59e0b);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* ===== SEARCH ===== */
#search{
  width:85%;
  margin:10px auto 15px;
  display:block;
  padding:10px;
  border-radius:10px;
  border:none;
  outline:none;
  text-align:center;
  background:#1e293b;
  color:#fff;
}

/* ===== CARD (LIGHTWEIGHT) ===== */
.card{
  margin:12px;
  padding:15px;
  border-radius:12px;
  background:#1e293b;
  border:1px solid rgba(255,255,255,0.08);
  transition:0.2s;
}

.card:hover{
  transform:scale(1.01);
  border-color:#22c55e;
}

/* ===== TEXT ===== */
.text{
  font-size:15px;
  line-height:2;
}

/* ===== COPY BUTTON ===== */
.actionBox{
  position:absolute;
  left:20px;
  top:10px;
}

.card{
  position:relative;
}

.actionBox button{
  background:#0f172a;
  border:none;
  padding:7px 9px;
  border-radius:8px;
  color:#fff;
  cursor:pointer;
}

.actionBox button:active{
  transform:scale(0.95);
}

/* ===== LOAD ===== */
#loadMore{
  margin:20px auto;
  display:block;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:#000;
  font-weight:800;
}

</style>
</head>

<body>

<div class="title">🔥 فری فائر اقوال</div>

<input id="search" placeholder="اقوال تلاش کریں..." oninput="searchQuotes()">

<div id="container"></div>

<button id="loadMore" onclick="loadMore()">مزید لوڈ کریں</button>

<script>

const quotes = Array.from({length:120},(_,i)=>({
id:i,
show:"🔥 یہ قول نمبر "+(i+1),
copy:"quote "+(i+1)
}));

let filtered=[...quotes];
let page=1;
let limit=15;

/* SEARCH */
function searchQuotes(){
let v=document.getElementById("search").value.toLowerCase();
filtered=quotes.filter(q=>q.show.toLowerCase().includes(v));
page=1;
render();
}

/* LOAD MORE */
function loadMore(){
page++;
render();
}

/* RENDER (FAST) */
function render(){
let c=document.getElementById("container");
c.innerHTML="";

let end = page * limit;

for(let i=0;i<end && i<filtered.length;i++){
let q = filtered[i];

c.innerHTML += `
<div class="card">

<div class="actionBox">
<button onclick="navigator.clipboard.writeText('${q.copy}')">
<i class="fas fa-copy"></i>
</button>
</div>

<div class="text">${q.show}</div>

</div>`;
}
}

render();

</script>

</body>
</html>
